[package]
name = "iridion"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
image = "0.25.10"
palette = "0.7.7"
serde_json = "1.0.151"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
